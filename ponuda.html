<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponuda · Brzo i Lokalno</title>
  <meta name="description" content="Ponuda iz Asistentice — specifikacija za klijenta.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://brzoilokalno.com/ponuda.html">
  <link rel="icon" href="assets/app-icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .offer-page { min-height: 100dvh; padding: 1.5rem 1rem 3rem; }
    .offer-card {
      width: min(100%, 640px); margin: 0 auto; padding: 1.5rem 1.35rem;
      border-radius: var(--radius, 16px); border: 1px solid var(--border, #ddd);
      background: var(--bg-card, #fff); box-shadow: var(--shadow, 0 8px 28px rgba(0,0,0,.08));
    }
    .offer-card .brand { display:flex; gap:.75rem; align-items:center; margin-bottom:1rem; }
    .offer-card h1 { margin: 0 0 .35rem; font-size: 1.35rem; }
    .offer-meta { color: #777; font-size: .9rem; margin: 0 0 1rem; }
    .offer-body {
      white-space: pre-wrap; line-height: 1.55; color: #1a1410;
      font-size: .98rem; border-top: 1px solid #eee; padding-top: 1rem;
    }
    .offer-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.25rem; }
    .offer-actions a {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .65rem 1rem; border-radius: 999px; font-weight: 600; text-decoration: none;
      font-size: .92rem;
    }
    .btn-primary { background: #e8884a; color: #141210; }
    .btn-ghost { background: #f3ebe3; color: #141210; }
    .offer-note { margin-top: 1.1rem; font-size: .82rem; color: #777; line-height: 1.4; }
    .empty-hint { color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="offer-page">
    <article class="offer-card">
      <div class="brand">
        <img src="assets/app-icon.png" alt="Brzo i Lokalno" width="56" height="56" style="border-radius:14px">
        <div>
          <strong>Brzo i Lokalno</strong>
          <div class="offer-meta" id="city-line">Ponuda iz Asistentice</div>
        </div>
      </div>
      <h1 id="offer-title">Ponuda</h1>
      <div id="offer-body" class="offer-body empty-hint">
        Učitavam…
      </div>
      <div class="offer-actions">
        <a class="btn-ghost" href="https://brzoilokalno.com/">Početna</a>
        <a class="btn-primary" href="https://brzoilokalno.com/preuzmi-app.html">App (opcionalno)</a>
      </div>
      <p class="offer-note" id="offer-note">
        Ako imaš PDF iz chata / WhatsAppa — to je pun dokument. Ova stranica pokazuje tekst ponude iz linka.
      </p>
    </article>
  </main>
  <script>
    (function () {
      var titleEl = document.getElementById("offer-title");
      var bodyEl = document.getElementById("offer-body");
      var cityEl = document.getElementById("city-line");
      var noteEl = document.getElementById("offer-note");

      function b64urlDecode(s) {
        s = (s || "").replace(/-/g, "+").replace(/_/g, "/");
        while (s.length % 4) s += "=";
        var bin = atob(s);
        try {
          return decodeURIComponent(
            Array.prototype.map.call(bin, function (c) {
              return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
            }).join("")
          );
        } catch (e) {
          return bin;
        }
      }

      function showEmpty() {
        titleEl.textContent = "Ponuda iz aplikacije";
        bodyEl.className = "offer-body empty-hint";
        bodyEl.textContent =
          "Otvori link koji ti je Asistentica poslala iz chata (sadrži #d=…). " +
          "Ili otvori PDF prilog iz poruke — tu je cijela specifikacija.\n\n" +
          "Ova stranica nije zamjena za PDF; prikazuje tekst kad je ugrađen u link.";
        noteEl.textContent =
          "PDF iz chata / WhatsAppa = pun dokument. App dugme je samo ulaz u Brzo i Lokalno.";
      }

      var hash = (location.hash || "").replace(/^#/, "");
      if (!hash) {
        var q = new URLSearchParams(location.search);
        hash = q.get("d") || "";
      }
      if (hash.indexOf("d=") === 0) hash = hash.slice(2);
      if (!hash) {
        showEmpty();
        return;
      }
      try {
        var data = JSON.parse(b64urlDecode(hash));
        var t = (data.t || "Ponuda").toString();
        var b = (data.b || "").toString();
        var c = (data.c || "").toString();
        document.title = t + " · Brzo i Lokalno";
        titleEl.textContent = t;
        if (c) cityEl.textContent = "Zona: " + c + " · Asistentica";
        bodyEl.className = "offer-body";
        bodyEl.textContent = b || "(Nema teksta u linku — otvori PDF prilog.)";
      } catch (e) {
        showEmpty();
      }
    })();
  </script>
</body>
</html>
