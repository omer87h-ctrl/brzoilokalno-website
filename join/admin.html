<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06080c"><link rel="icon" href="../assets/app-icon.png"><link rel="stylesheet" href="join.css"><link rel="stylesheet" href="admin.css"><title>Prijave saradnika — Brzo i Lokalno</title></head><body>
<header class="site-top"><a class="brand" href="/"><img src="../assets/app-icon.png" alt="" width="42" height="42">Brzo i Lokalno</a><a class="back" href="/join/">← Join the Project</a></header>
<main class="admin-shell"><div class="admin-top"><div><span class="step">PRIVATE / ADMIN</span><h1>Prijave za saradnju</h1><p>Privatni pregled. Podaci se ne prikazuju javno.</p></div><button id="logout" class="admin-button" type="button" hidden>Odjavi se</button></div>
<section id="login-area" class="admin-panel"><h2>Prijava administratora</h2><p>Prijavi se svojim postojećim Firebase email/password nalogom. Samo ovlašteni administrator može pregledati prijave.</p><form id="admin-login"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Lozinka<input type="password" name="password" autocomplete="current-password" required></label><button class="submit" type="submit">Prijavi se →</button></form></section>
<section id="applications-area" hidden><div class="admin-tools"><label>Pretraži<input id="search" placeholder="Ime, email, opis..."></label><label>Uloga<select id="role-filter"><option value="">Sve uloge</option><option value="graphic_design">Grafički dizajn</option><option value="ux_ui">UX/UI</option><option value="content">Content / video</option><option value="android">Android</option><option value="web">Web</option><option value="social">Social / writing</option><option value="other">Ostalo</option></select></label><button id="refresh" class="admin-button" type="button">Osvježi</button><button id="csv" class="admin-button" type="button">Preuzmi CSV</button></div><div id="count" class="count"></div><div id="applications" class="applications"></div></section><p role="status" id="admin-status" class="form-status" aria-live="polite"></p>
</main><script type="module" src="admin.js"></script></body></html>
