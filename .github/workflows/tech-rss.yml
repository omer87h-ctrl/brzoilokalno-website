name: Refresh TECH RSS
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update attributed headline links
        run: python3 tech/update-news.py
      - name: Commit new headlines if changed
        run: |
          if git diff --quiet -- tech/news-live.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech/news-live.json
          git commit -m "Update sourced TECH headlines"
          git push
