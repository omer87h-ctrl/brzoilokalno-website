name: Refresh TECH Pulse Headlines
on:
  schedule:
    - cron: '24 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
      - name: Refresh permitted source titles
        run: python3 tech/update-news.py
      - name: Commit reviewed-source feed data
        run: |
          if git diff --quiet -- tech/news-feed.js; then
            echo "No changes to headlines"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tech/news-feed.js
          git commit -m "Refresh externally attributed TECH Pulse headlines"
          git push
